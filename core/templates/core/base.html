<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ФОП Кадри{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">ФОП Кадри</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">ФОП</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Працівники</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Накази</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Повідомлення ДПС</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Зарплата</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Табель</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Звітність</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">⚙Налаштування</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold">Вітаємо у ФОП Кадри!</h1>
            <p class="col-md-8 fs-4">Система готова до налаштування моделей та бізнес-логіки.</p>
        </div>
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
