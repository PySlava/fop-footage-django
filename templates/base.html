<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ФОП Кадри{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Навігаційне меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">
                <i class="bi bi-people-fill me-2"></i>ФОП Кадри
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'fops:list' %}"><i class="bi bi-briefcase me-1"></i>ФОП</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'employees:list' %}"><i class="bi bi-person-badge me-1"></i>Працівники</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'employees:orders_list' %}"><i class="bi bi-file-earmark-text me-1"></i>Накази</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'timesheet:list' %}"><i class="bi bi-calendar3 me-1"></i>Табель</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'salary:list' %}"><i class="bi bi-cash-stack me-1"></i>Зарплата</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'reports:notice_list' %}">
                            <i class="bi bi-file-earmark-code me-1"></i>Звітність та ДПС
                        </a>
                    </li>
                    <!-- Доданий пункт Аналітики -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard:index' %}">
                            <i class="bi bi-graph-up-arrow me-1"></i>Аналітика
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'admin:index' %}"><i class="bi bi-gear me-1"></i>Налаштування</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контент -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
